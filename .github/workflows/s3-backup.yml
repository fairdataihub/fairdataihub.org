name: Back up Bunny storage to R2

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be copied and pruned without changing anything'
        type: boolean
        default: false

concurrency:
  group: s3-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backup
        env:
          BUNNY_ENDPOINT: ${{ secrets.BUNNY_ENDPOINT }}
          BUNNY_BUCKET: ${{ secrets.BUNNY_BUCKET }}
          BUNNY_REGION: ${{ secrets.BUNNY_REGION || 'la' }}
          BUNNY_ACCESS_KEY_ID: ${{ secrets.BUNNY_ACCESS_KEY_ID }}
          BUNNY_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REGION: ${{ secrets.R2_REGION || 'auto' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SNAPSHOT_PREFIX: ${{ secrets.SNAPSHOT_PREFIX || 'snapshots/' }}
          KEEP_DAILY: ${{ secrets.KEEP_DAILY || '30' }}
          KEEP_MONTHLY: ${{ secrets.KEEP_MONTHLY || '12' }}
          CONCURRENCY: ${{ secrets.CONCURRENCY || '8' }}
        run: pnpm scripts:s3_backup ${{ inputs.dry_run && '--dry-run' || '' }}
